name: Send canteen menus

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Call idempotent sender
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          APP_URL="${APP_URL:-https://canteen-mi-arai-kin.vercel.app}"
          AUTH_HEADER=()
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $CRON_SECRET")
          fi
          curl --fail-with-body --silent --show-error --max-time 40 \
            -X POST "$APP_URL/api/cron/send" \
            "${AUTH_HEADER[@]}"
